packages:
  - apps/*
  - apps/web/studio
  - packages/*
  - functions/*

# Versions shared by more than one package, set once here and referenced as "catalog:" (or
# "catalog:native") in the packages' package.json. Bump them here, then run `pnpm install`.
catalog:
  "@auth0/auth0-react": 2.28.2
  "@google-cloud/functions-framework": 5.0.5
  "@trpc/client": 11.19.0
  "@trpc/server": 11.19.0
  "@trpc/tanstack-react-query": 11.19.0
  "@types/luxon": 3.7.6
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.0.5
  cross-env: 10.1.0
  csv-parse: 7.0.3
  date-fns: 4.4.0
  dotenv: 18.0.9
  katex: 0.19.1
  luxon: 3.7.2
  node-fetch: 2.7.0
  norwegian-workdays: github:stiftelsen-effekt/norwegian-workdays#v1.1.0
  oxlint: 1.90.0
  prettier: 3.9.10
  react: 19.3.1
  react-dom: 19.3.1
  react-feather: 2.0.10
  styled-components: 6.6.0
  # The API (ts-node, Vitest's spec transform) and the website (next build, the tRPC type
  # build) use TypeScript's JavaScript API, which TypeScript 7 doesn't have yet. Packages that
  # only run `tsc` use the native compiler from the `native` catalog below.
  typescript: 5.9.3
  vitest: 5.0.5
  zod: 4.6.7

catalogs:
  native:
    typescript: 7.0.2

# Dependency install scripts pnpm may run. Prisma needs its own; cypress (apps/web) downloads its
# binary; esbuild sets up its platform binaries. ssh2 and cpu-features have JS
# fallbacks, @parcel/watcher only builds from source when asked to, and browser-tabs-lock and
# @scarf/scarf only print a banner.
allowBuilds:
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  browser-tabs-lock: false
  cpu-features: false
  cypress: true
  esbuild: true
  prisma: true
  ssh2: false

# From apps/web (formerly main-site) and its studio. Overrides apply to the whole workspace; apps/admin pins
# @types/react 19.3.0, which satisfies ^19.3.0.
overrides:
  "@types/react": ^19.3.0
  "@module-federation/vite>@module-federation/dts-plugin": ^2.9.2
  # 7.29.1 has CVEs fixed in 7.30.1 (Semgrep Supply Chain)
  "@module-federation/dts-plugin>undici": ^7.30.1
  "@vercel/frameworks>js-yaml": ^3.15.2
  "@vercel/frameworks>smol-toml": ^1.9.0
  typeid-js>uuid: ^11.1.1

# Supply-chain settings (docs/dependencies.md). pnpm resolves no version published less than
# 7 days ago (10080 minutes; pnpm's built-in default is 1 day) and fails instead of picking one
# (minimumReleaseAgeStrict defaults to true once the age is set). `pnpm install --frozen-lockfile`
# checks the lockfile against the same rules, so CI, Vercel and Cloud Build refuse a lockfile that
# brings in a younger version. Dependabot reads minimumReleaseAge as the floor of its cooldown.
minimumReleaseAge: 10080
# Refuse a version that has weaker publish evidence (trusted publishing, provenance) than an
# earlier version of the same package, the usual sign of a release from a stolen npm token.
# Versions published more than 30 days (43200 minutes) ago are not checked: by then a takeover
# would have been found, and old maintenance releases (semver 5.x and 6.x, jose 4.x) predate
# provenance.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
# Exact versions exempt from trustPolicy, each with the reason.
trustPolicyExclude:
  # prisma publishes from its prismabot npm account again since 7.10.0 (7.6 to 7.9 came from
  # GitHub Actions with provenance). Same publisher as before provenance; check the next release.
  - "prisma@7.10.1"
  # Published by the maintainer's own account between two CI releases; 1.7.3 and later are
  # back on GitHub Actions with provenance. A Dependabot update replaces these.
  - "seroval@1.7.2"
  - "seroval-plugins@1.7.2"
# Only our own package.json files may point at git repositories or tarball URLs (such as
# norwegian-workdays); a dependency's dependencies have to come from the registry.
blockExoticSubdeps: true

# Exact versions exempt from minimumReleaseAge. Add one only for a reviewed reason (an urgent
# fix), with a comment, and remove it once the version is older than 7 days.
minimumReleaseAgeExclude:
  # The lockfile entries younger than 7 days when the age went from 1 to 7 days (2026-10-31).
  # They were already installed everywhere. All of them are older than 7 days from 2026-11-07,
  # when this block can be deleted.
