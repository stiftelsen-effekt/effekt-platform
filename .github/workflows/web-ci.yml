name: web-ci
# Production only: the previews are tested by ci.yml. To be replaced by deploy.yml (docs/ci.md).
# e2e tests against Vercel deployments of apps/web. Vercel reports a deployment_status for each
# deployment; the environment ("Preview – <project>" or "Production – <project>") picks the test
# suite. Other environments (such as giv-effektivt's custom `api-dev`), deployments of other
# projects and other deployment statuses in this repository run nothing.
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
on: [deployment_status]
permissions: {}
jobs:
  e2e-no:
    name: web · NO
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production – main-site'
    # Production runs share the site and the Min Side test account: one at a time, and only the
    # newest waiting one runs (GitHub drops older pending runs in the group). Previews run freely.
    concurrency:
      group: web-e2e-no-${{ startsWith(github.event.deployment_status.environment, 'Production') && 'production' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: $/.github/workflows/web-e2e.yml
    with:
      group: "GiEffektivt e2e tests"
      # The production Min Side Auth0 app only allows exact callbacks, so production
      # deployments are tested on the custom domain instead of their *.vercel.app URL
      base-url: ${{ startsWith(github.event.deployment_status.environment, 'Production') && 'https://gieffektivt.no' || github.event.deployment_status.target_url }}
      config-file: "cypress-no.config.ts"
    secrets:
      CYPRESS_AUTH_DOMAIN: ${{ secrets.CYPRESS_AUTH_DOMAIN }}
      CYPRESS_AUTH_USERNAME: ${{ secrets.CYPRESS_AUTH_USERNAME }}
      CYPRESS_AUTH_PASSWORD: ${{ secrets.CYPRESS_AUTH_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  e2e-dk:
    name: web · DK
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production – giv-effektivt'
    # Production runs share the site and the Min Side test account: one at a time, and only the
    # newest waiting one runs (GitHub drops older pending runs in the group). Previews run freely.
    concurrency:
      group: web-e2e-dk-${{ startsWith(github.event.deployment_status.environment, 'Production') && 'production' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: $/.github/workflows/web-e2e.yml
    with:
      group: "GivEffektivt e2e tests"
      base-url: ${{ github.event.deployment_status.target_url }}
      config-file: "cypress-dk.config.ts"
    secrets:
      CYPRESS_AUTH_DOMAIN: ${{ secrets.CYPRESS_AUTH_DOMAIN }}
      CYPRESS_AUTH_USERNAME: ${{ secrets.CYPRESS_AUTH_USERNAME }}
      CYPRESS_AUTH_PASSWORD: ${{ secrets.CYPRESS_AUTH_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
  e2e-se:
    name: web · SE
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production – ge-effektivt'
    concurrency:
      group: web-e2e-se-${{ startsWith(github.event.deployment_status.environment, 'Production') && 'production' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: $/.github/workflows/web-e2e.yml
    with:
      group: "GeEffektivt smoke tests"
      label: smoke
      containers: "[1]"
      # Production is tested on the custom domain, like Norway
      base-url: ${{ startsWith(github.event.deployment_status.environment, 'Production') && 'https://geeffektivt.se' || github.event.deployment_status.target_url }}
      config-file: "cypress-se.config.ts"
    secrets:
      CYPRESS_AUTH_DOMAIN: ${{ secrets.CYPRESS_AUTH_DOMAIN }}
      CYPRESS_AUTH_USERNAME: ${{ secrets.CYPRESS_AUTH_USERNAME }}
      CYPRESS_AUTH_PASSWORD: ${{ secrets.CYPRESS_AUTH_PASSWORD }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
