name: web-checks
# Lint, typecheck and unit tests for apps/web (the website, formerly the main-site repository).
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-checks.yml"
      # The web typechecks against the backend's tRPC router (packages/api, docs/web-trpc.md)
      - "apps/api/src/trpc/**"
      - "packages/api/**"
      - "apps/api/scripts/build-types.mjs"
      - "apps/api/tsconfig.trpc.json"
      - "packages/config/**"
      - ".nvmrc"
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: apps/web
jobs:
  # Branch protection can only require a check that always reports, and a workflow skipped by a
  # `paths` filter never does. So pull requests always start this workflow, this job decides
  # whether the change touches what the checks cover (the same paths as the push trigger), and
  # "web-checks (required)" below is the check to require: it passes when the checks passed or
  # had nothing to check. docs/dependencies.md
  changes:
    name: web-checks · changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - name: Match the changed files
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          relevant=false
          if [ "$EVENT" != pull_request ]; then
            relevant=true # the push trigger's paths filter already matched
          else
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' >"$RUNNER_TEMP/changed-files"
            count=0
            while IFS= read -r file; do
              count=$((count + 1))
              case "$file" in
                apps/web/* | pnpm-lock.yaml | pnpm-workspace.yaml | .github/workflows/web-checks.yml | apps/api/src/trpc/* | packages/api/* | apps/api/scripts/build-types.mjs | apps/api/tsconfig.trpc.json | packages/config/* | .nvmrc) relevant=true ;;
              esac
            done <"$RUNNER_TEMP/changed-files"
            # The files API lists at most 3000 files; treat a larger change as relevant.
            if [ "$count" -ge 3000 ]; then relevant=true; fi
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"
  checks:
    name: Lint, typecheck and test (web)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Only the web package's dependencies (not the backend's or the admin's).
      - name: Install dependencies
        # Same as the Vercel projects' install command: the web build compiles the tRPC types
        # with the API package's dependencies (docs/web-trpc.md). Keep the two in sync. The
        # Sanity studio (effekt-studio) is extra here: the Vercel build installs it itself.
        run: pnpm install --frozen-lockfile --filter main-site --filter stiftelsen-effekt-backend --filter effekt-studio
        env:
          # Cypress runs in web-e2e.yml; this job doesn't need its binary.
          CYPRESS_INSTALL_BINARY: "0"
      # tsc's incremental build info, for both the API's tRPC declarations (apps/api/dist-types,
      # docs/web-trpc.md) and the web typecheck. tsc compares file contents, so build info from an
      # older commit only means less is skipped, never a stale result.
      - name: Restore the TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/api/dist-types
            apps/web/node_modules/.cache/tsc
          key: web-tsc-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            web-tsc-${{ hashFiles('pnpm-lock.yaml') }}-
            web-tsc-
      - name: Build the tRPC types
        run: pnpm types:api
      # Typecheck (`pnpm typecheck` minus the type build above, incremental), lint and test are
      # independent of each other: run them at once and print each one's output in its own group.
      - name: Typecheck, lint and test
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          pnpm exec tsc --noEmit --incremental --tsBuildInfoFile node_modules/.cache/tsc/web.tsbuildinfo \
            >"$RUNNER_TEMP/checks/typecheck.log" 2>&1 & tsc=$!
          pnpm lint >"$RUNNER_TEMP/checks/lint.log" 2>&1 & lint=$!
          pnpm test >"$RUNNER_TEMP/checks/test.log" 2>&1 & tests=$!
          failed=""
          for check in typecheck:$tsc lint:$lint test:$tests; do
            name=${check%%:*}
            if wait "${check##*:}"; then status=passed; else status=FAILED; failed="$failed $name"; fi
            echo "::group::$name ($status)"
            cat "$RUNNER_TEMP/checks/$name.log"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
      - name: Studio typecheck and test
        working-directory: apps/web/studio
        run: pnpm typecheck && pnpm test

  required:
    name: web-checks (required)
    needs: [changes, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check the results
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "changes: $CHANGES, checks: $RESULT"
          [ "$CHANGES" = success ] || exit 1
          case "$RESULT" in success | skipped) ;; *) exit 1 ;; esac
