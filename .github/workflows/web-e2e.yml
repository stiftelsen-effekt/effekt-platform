name: web-e2e
# The Cypress suite of one website against its production deployment, called by deploy.yml.
# A reusable workflow so that the caller's job-level concurrency covers all shards at once:
# production runs share the site and the Min Side test account.
on:
  workflow_call:
    inputs:
      group:
        description: The Cypress Cloud group (one per suite)
        required: true
        type: string
      config-file:
        required: true
        type: string
      base-url:
        required: true
        type: string
      containers:
        description: The shards, as a JSON list
        required: false
        type: string
        default: "[1, 2, 3, 4, 5, 6]"
      label:
        description: The jobs' names, e.g. "e2e" gives "e2e 1/6"
        required: false
        type: string
        default: e2e
    secrets:
      CYPRESS_AUTH_DOMAIN:
        required: true
      CYPRESS_AUTH_USERNAME:
        required: true
      CYPRESS_AUTH_PASSWORD:
        required: true
      CYPRESS_RECORD_KEY:
        required: true
permissions: {}
jobs:
  e2e:
    name: ${{ inputs.label }} ${{ matrix.containers }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Cancelling a shard kills its Cypress process and leaves the Cypress Cloud run hanging
      # (https://github.com/cypress-io/github-action/issues/48)
      fail-fast: false
      matrix:
        containers: ${{ fromJSON(inputs.containers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cypress
        uses: ./.github/actions/cypress-deployment # zizmor: ignore[self-repository] -- actionlint does not read `$/` for actions yet
        with:
          config-file: ${{ inputs.config-file }}
          base-url: ${{ inputs.base-url }}
          group: ${{ inputs.group }}
          ci-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.group }}
          record-key: ${{ secrets.CYPRESS_RECORD_KEY }}
          auth-domain: ${{ secrets.CYPRESS_AUTH_DOMAIN }}
          auth-username: ${{ secrets.CYPRESS_AUTH_USERNAME }}
          auth-password: ${{ secrets.CYPRESS_AUTH_PASSWORD }}
