steps:
  # Skip the whole deploy when a newer commit has reached main since this build started: its
  # own build deploys instead (scripts/deploy/guard.sh, docs/deploy.md). Every later step runs
  # through scripts/deploy/unless-skipped.sh.
  - name: "gcr.io/cloud-builders/git"
    id: "guard"
    entrypoint: "bash"
    env: ["COMMIT_SHA=$COMMIT_SHA", "DEPLOY_GUARD_IGNORE=$_GUARD_IGNORE"]
    args: ["scripts/deploy/guard.sh"]

  # The API image (apps/api/Dockerfile), built from the repository root with BuildKit (buildx)
  # and a layer cache kept in the registry (scripts/deploy/build-api-image.sh), and pushed as
  # this build's own tag, to the Artifact Registry repository `effekt` in europe-north1, the region
  # of the services, the migrate jobs and Cloud SQL (scripts/deploy/api-registry.sh). Images built
  # before the move stay on gcr.io/<project>/effektapi for rollbacks to older revisions.
  # Publishing that tag changes nothing in production. Every later step uses the image by this
  # tag, effektapi:$BUILD_ID, never by :latest: a parallel older build may move :latest after
  # this one, and deploying by a shared tag would then ship its image (docs/deploy.md).
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    entrypoint: "bash"
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "bash"
      - "scripts/deploy/build-api-image.sh"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:$BUILD_ID"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:buildcache"

  # Check again before touching production: a newer merge may have landed during the image build
  - name: "gcr.io/cloud-builders/git"
    id: "guard-before-release"
    entrypoint: "bash"
    env: ["COMMIT_SHA=$COMMIT_SHA", "DEPLOY_GUARD_IGNORE=$_GUARD_IGNORE"]
    args: ["scripts/deploy/guard.sh"]

  # :latest is a convenience tag for people (docker pull); nothing deploys from it. It is moved
  # by pushing the manifest under the new tag (no upload). That needs only tags.update, which the
  # build's artifactregistry.writer role has; `gcloud artifacts docker tags add` deletes the old
  # tag first and needs tags.delete. allowFailure: a stale :latest must never block a deploy.
  - name: "gcr.io/cloud-builders/docker"
    id: "push-latest"
    waitFor: ["guard-before-release"]
    allowFailure: true
    entrypoint: "bash"
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "docker"
      - "buildx"
      - "imagetools"
      - "create"
      - "--tag"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:latest"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:$BUILD_ID"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "migrate-db-norway"
    waitFor: ["guard-before-release"]
    entrypoint: "bash"
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "gcloud"
      - "run"
      - "jobs"
      - "update"
      - "effektapi-db-migrate"
      - "--image"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:$BUILD_ID"
      - "--region"
      - "europe-north1"
      - "--execute-now"
      - "--wait"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-norway"
    waitFor: ["migrate-db-norway"]
    entrypoint: "bash"
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "gcloud"
      - "run"
      - "deploy"
      - "effektapi"
      - "--image"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:$BUILD_ID"
      - "--region"
      - "europe-north1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

  # Sweden migrates and deploys alongside Norway: separate databases, separate services
  - name: "gcr.io/cloud-builders/gcloud"
    id: "migrate-db-sweden"
    waitFor: ["guard-before-release"]
    entrypoint: "bash"
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "gcloud"
      - "run"
      - "jobs"
      - "update"
      - "geeffektivt-db-migrate"
      - "--image"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:$BUILD_ID"
      - "--region"
      - "europe-north1"
      - "--execute-now"
      - "--wait"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-sweden"
    waitFor: ["migrate-db-sweden"]
    entrypoint: "bash"
    args:
      - "scripts/deploy/unless-skipped.sh"
      - "gcloud"
      - "run"
      - "deploy"
      - "geeffektivt"
      - "--image"
      - "europe-north1-docker.pkg.dev/$PROJECT_ID/effekt/effektapi:$BUILD_ID"
      - "--region"
      - "europe-north1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

substitutions:
  # The BackendDeploy trigger's ignoredFiles: the guard skips this build only for a newer commit
  # that changes a file outside them, since only such a commit starts a newer build. Keep in sync
  # with the trigger (docs/deploy.md).
  _GUARD_IGNORE: "apps/web/** apps/admin/** docs/** .github/** functions/**"

# No `images:`: the push step above publishes the image, and a skipped build has none to push.

options:
  logging: CLOUD_LOGGING_ONLY
